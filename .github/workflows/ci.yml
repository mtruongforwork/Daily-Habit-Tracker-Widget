name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore HabitGrid.sln
      - name: Build
        run: dotnet build HabitGrid.sln -c Release --no-restore
      - name: Test
        run: dotnet test HabitGrid.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: WinUI smoke test
        shell: pwsh
        run: |
          $env:HABITGRID_DATA_DIR = Join-Path $env:RUNNER_TEMP 'hg-smoke'
          $exe = Get-ChildItem src/HabitGrid.WinUI/bin -Recurse -Filter HabitGrid.WinUI.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--smoke' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Error 'smoke timed out'; exit 1 }
          Get-Content "$env:HABITGRID_DATA_DIR/logs/*.log" -ErrorAction SilentlyContinue
          exit $p.ExitCode
      - name: WidgetHost self-test (reads the smoke database, check-in round trip)
        shell: pwsh
        run: |
          $env:HABITGRID_DATA_DIR = Join-Path $env:RUNNER_TEMP 'hg-smoke'
          $exe = Get-ChildItem src/HabitGrid.WidgetHost/bin -Recurse -Filter HabitGrid.WidgetHost.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error 'widget host self-test timed out'; exit 1 }
          Get-Content "$env:HABITGRID_DATA_DIR/widgethost-selftest.log" -ErrorAction SilentlyContinue
          exit $p.ExitCode
      - name: Erase-all-data flow (smoke on its own data dir)
        shell: pwsh
        run: |
          $env:HABITGRID_DATA_DIR = Join-Path $env:RUNNER_TEMP 'hg-erase'
          $env:HABITGRID_SMOKE_ERASE = '1'
          $exe = Get-ChildItem src/HabitGrid.WinUI/bin -Recurse -Filter HabitGrid.WinUI.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--smoke' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error 'erase smoke timed out'; exit 1 }
          exit $p.ExitCode
      - name: WidgetHost survives Explorer restart (experimental, non-blocking)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:HABITGRID_DATA_DIR = Join-Path $env:RUNNER_TEMP 'hg-smoke'
          $log = "$env:HABITGRID_DATA_DIR/widgethost-selftest.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $exe = Get-ChildItem src/HabitGrid.WidgetHost/bin -Recurse -Filter HabitGrid.WidgetHost.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '--selftest-explorer' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Error 'explorer self-test timed out'; exit 1 }
          Get-Content $log -ErrorAction SilentlyContinue
          Write-Host "exit code: $($p.ExitCode) (0 = recovered, 5 = could not evaluate on this machine)"
          exit $p.ExitCode
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            ${{ runner.temp }}/hg-smoke/shots/*.png
            ${{ runner.temp }}/hg-smoke/logs/*.log
          if-no-files-found: ignore
      - name: Vulnerable packages
        shell: bash
        run: |
          out=$(dotnet list HabitGrid.sln package --vulnerable --include-transitive 2>&1)
          echo "$out"
          if echo "$out" | grep -q "has the following vulnerable packages"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/test-results.trx"
